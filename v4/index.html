<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コリドール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090c1a;--ink:#e9ecff;--mute:#8d94bd;--p0:#ff6b4a;--p1:#2ee6d6;--gold:#ffd98a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(900px 500px at 15% -10%,#2a1f4f 0,transparent 60%),radial-gradient(800px 500px at 100% 110%,#0f3a4a 0,transparent 60%),var(--bg);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-weight:500;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px}
h1{margin:6px 0 14px;text-align:center;line-height:1}
h1 b{display:block;font-family:Outfit,"Helvetica Neue",sans-serif;font-weight:800;font-size:clamp(28px,8vw,42px);letter-spacing:.32em;margin-right:-.32em;background:linear-gradient(90deg,var(--p0),var(--gold),var(--p1));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{display:block;margin-top:8px;font-size:12px;letter-spacing:.5em;color:var(--mute)}
.wrap{width:min(94vw,560px)}
.turn{--tc:var(--p0);display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 -2px 0 var(--tc),0 10px 30px -12px var(--tc);font-weight:700;font-size:16px;transition:box-shadow .3s}
.turn.t1{--tc:var(--p1)}
.turn small{margin-left:auto;color:var(--mute);font-size:12px;font-weight:500}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;margin-right:6px;background:var(--p0);box-shadow:0 0 10px var(--p0)}
.dot.d1{background:var(--p1);box-shadow:0 0 10px var(--p1)}
.turn .dot{margin:0;width:14px;height:14px}
.hint{min-height:1.5em;margin:10px 2px;font-size:13px;color:var(--mute)}
.score{display:flex;gap:10px;margin-bottom:12px}
.sc{flex:1;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.sc b{font-family:Outfit,sans-serif;font-weight:700}
.pips{flex-basis:100%;display:flex;gap:3px;min-height:4px}
.pips i{flex:0 0 calc(10% - 3px);height:4px;border-radius:2px;background:var(--gold);box-shadow:0 0 6px rgba(255,217,138,.6)}
.board{--tc:var(--p0);display:grid;grid-template:repeat(8,1fr .34fr) 1fr/repeat(8,1fr .34fr) 1fr;aspect-ratio:1;padding:3%;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 30px 80px -30px var(--tc);transition:box-shadow .4s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board.t1{--tc:var(--p1)}
.cell{border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;position:relative}
.cell.g0{background:linear-gradient(0deg,transparent,rgba(255,107,74,.25));border-color:rgba(255,107,74,.35)}
.cell.g1{background:linear-gradient(180deg,transparent,rgba(46,230,214,.25));border-color:rgba(46,230,214,.35)}
.cell.ok{cursor:pointer;background:rgba(255,255,255,.14);border-color:var(--tc)}
.cell.ok:hover{background:rgba(255,255,255,.26)}
.cell.ok::after{content:"";width:30%;height:30%;border-radius:50%;background:var(--tc);box-shadow:0 0 14px var(--tc);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{transform:scale(.6);opacity:.6}}
@keyframes ring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.25);opacity:0}}
@keyframes arr{from{transform:scale(1.7);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes burst{from{transform:scale(1);opacity:1}to{transform:scale(2.6);opacity:0}}
.gr{z-index:1}
.wm .gr{cursor:pointer;background:rgba(255,255,255,.1);border-radius:3px;transition:background .15s}
.wm .gr:hover{background:rgba(255,255,255,.4)}
.wall{z-index:2;border-radius:4px;pointer-events:none;background:linear-gradient(135deg,#fff,var(--gold));box-shadow:0 0 14px rgba(255,217,138,.75)}
.wall.new{animation:drop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{0%{transform:scale(2.2);opacity:0;filter:brightness(2)}60%{opacity:1}100%{transform:none;filter:none}}
.wall.pre{background:rgba(255,255,255,.2);box-shadow:0 0 0 1.5px #fff,0 0 18px rgba(255,255,255,.7);animation:blink 1s infinite}
.modes{display:flex;padding:4px;gap:4px;margin:16px 0 10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
button{font:inherit;color:var(--ink);cursor:pointer}
.modes button{flex:1;border:0;border-radius:10px;padding:12px 8px;font-weight:700;font-size:15px;background:transparent;transition:background .2s,color .2s}
.modes button.on{background:#fff;color:#0b0e1a;box-shadow:0 0 22px rgba(255,255,255,.35)}
.ctl{display:flex}
.ctl button{flex:1;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:transparent;font-size:14px}
.ctl button:hover{background:rgba(255,255,255,.08)}
button:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
details{margin-top:14px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.8;color:#c9cdee}
summary{font-weight:700;cursor:pointer;color:var(--ink)}
details ol{margin:6px 0 0;padding-left:1.3em}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;padding:20px;background:rgba(5,7,18,.78);backdrop-filter:blur(8px);overflow:hidden}
.ov.show{display:flex}
.ov>div{position:relative;text-align:center;padding:30px 40px;border-radius:22px;background:rgba(20,24,52,.92);border:1px solid rgba(255,255,255,.15)}
.ov .big .dot{width:56px;height:56px;margin:0;box-shadow:0 0 44px 6px var(--p0)}
.ov .big .dot.d1{box-shadow:0 0 44px 6px var(--p1)}
.ov h2{font-weight:800;font-size:28px;margin:18px 0 4px}
.ov button{margin-top:14px;padding:12px 28px;border-radius:12px;border:0;font-weight:700;background:#fff;color:#0b0e1a}
.cf{position:absolute;left:50%;top:50%;width:8px;height:14px;border-radius:2px;opacity:0;animation:fly 1.5s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
body{padding-bottom:120px}
.bar{width:min(94vw,560px);display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.bar h1{margin:0}.bar h1 b{font-size:20px;margin-right:0;letter-spacing:.3em}
#snd{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);border-radius:99px;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.08em}
.wrap{animation:intro .6s ease-out}
@keyframes intro{from{opacity:0;transform:translateY(12px)}}
.pl{margin:10px 0}
.pc{--pc:var(--p0);position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);transition:.3s}
.pc.act{background:rgba(255,255,255,.09);border-color:var(--pc);box-shadow:0 0 0 1px var(--pc),0 12px 36px -12px var(--pc)}
.av{width:40px;height:50px;flex:none;display:flex}
.av svg{width:100%;height:100%}
.nm{flex:1;display:flex;flex-direction:column;font-weight:700;font-size:15px}
.nm small{color:var(--mute);font-weight:500;font-size:11px;margin-top:2px}
.wl{text-align:right;font-family:Outfit,sans-serif;line-height:1}
.wl b{font-size:26px;font-weight:700}
.wl small{display:block;font-size:10px;color:var(--mute);margin-top:3px;letter-spacing:.1em}
.pc .pips{flex-basis:100%}
.now{position:absolute;top:-9px;right:14px;font-style:normal;font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--pc);color:#0b0e1a}
.pawn{position:relative;width:84%;height:94%;display:block}
.pawn svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 8px var(--gl))}
.pawn.p0{--gl:rgba(255,107,74,.8)}.pawn.p1{--gl:rgba(46,230,214,.8)}
.pawn.me svg{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6%)}}
.pawn::before{content:"";position:absolute;left:8%;right:8%;bottom:2%;height:16%;border-radius:50%;border:1.5px solid var(--gl);opacity:0}
.pawn.me::before{animation:fring 1.6s ease-out infinite}
@keyframes fring{from{transform:scale(.7);opacity:.9}to{transform:scale(1.5);opacity:0}}
.pawn.land::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20%;border-radius:50%;border:3px solid var(--gl);animation:fburst .6s ease-out forwards}
@keyframes fburst{from{transform:scale(.8);opacity:1}to{transform:scale(2.4);opacity:0}}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(92vw,420px);display:flex;gap:6px;padding:6px;border-radius:22px;background:rgba(20,24,52,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px -10px rgba(0,0,0,.6);z-index:5}
.dock button{flex:1;border:0;border-radius:16px;padding:13px 6px;font-weight:700;font-size:15px;background:transparent;transition:.2s}
.dock button.on{background:#fff;color:#0b0e1a;box-shadow:0 0 22px rgba(255,255,255,.3)}
.dock #reset{flex:.7;color:var(--mute)}
.ov .big svg{width:84px;height:100px}
.hb{display:flex;gap:6px}
#reset{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);border-radius:99px;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.08em}
#reset.arm{background:var(--p0);color:#0b0e1a;border-color:var(--p0)}
.dock button:disabled{opacity:.35;cursor:default}
.dock #undo{flex:1.2}
.bar h1 b{background:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#fff;color:#fff;font-weight:700}
.pr{display:flex;gap:8px}
.pr .pl{flex:1;min-width:0;margin:10px 0}
.pr .pc{padding:8px 10px;gap:4px 8px}
.pr .av{width:30px;height:38px}
.pr .nm{font-size:14px;min-width:0}
.pr .wl b{font-size:22px}
.pr .now{right:8px}
.cell.g0{background:linear-gradient(90deg,rgba(255,107,74,.28),transparent)}
.cell.g1{background:linear-gradient(270deg,rgba(46,230,214,.28),transparent)}
.wm .gr.on{background:#fff;box-shadow:0 0 12px #fff}
.wm .gr.pick{background:var(--gold);box-shadow:0 0 14px var(--gold);animation:pk .9s infinite}
@keyframes pk{50%{opacity:.4}}
.wall.pre{animation:pk 1.2s infinite}
.sp{width:min(92vw,380px);display:flex;flex-direction:column;gap:10px;padding:26px 22px}
.st{font-family:Outfit,sans-serif;font-weight:800;letter-spacing:.3em;margin:0 -.3em 0 0;font-size:26px;color:#fff}
.sub{margin:0 0 6px;font-size:12px;letter-spacing:.5em;color:var(--mute)}
.sp label{font-size:12px;color:var(--mute);text-align:left;margin-top:6px}
.opt{display:flex;flex-direction:column;gap:6px}.opt[hidden]{display:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.ov .seg button{flex:1;margin:0;padding:11px 4px;border-radius:10px;background:transparent;color:var(--ink);font-size:14px}
.ov .seg button.on{background:#fff;color:#0b0e1a}
#go{width:100%;margin-top:14px;padding:14px;font-size:16px}
#menu2{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.25)}
.tm{display:block;width:100%;margin-top:12px;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:transparent;font-size:14px}
.tm.arm{background:var(--p0);color:#0b0e1a;border-color:var(--p0)}
:root:lang(zh) body{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
#sgLang{margin-bottom:2px}.ov #sgLang button{font-size:13px;padding:8px 4px}
</style>
</head>
<body>
<header class="bar"><h1><b>QUORIDOR</b></h1><div class="hb"><button id="snd">♪ ON</button><button id="reset" data-i="restart">最初から</button></div></header>
<div class="wrap">
<div class="pr"><div class="pl" id="pl1"></div><div class="pl" id="pl0"></div></div>
<div class="hint" id="hint"></div>
<div class="board" id="board"></div>
<details>
    <summary data-i="rulesT">あそびかた</summary>
    <ol>
      <li data-i="r1">x</li>
      <li data-i="r2">x</li>
      <li data-i="r3">x</li>
      <li data-i="r4">x</li>
      <li data-i="r5">x</li>
      <li data-i="r6">x</li>
      <li data-i="r7">x</li>
    </ol>
  </details>
<button id="toMenu" class="tm" data-i="toMenu">メニューにもどる</button>
</div>
<nav class="dock"><button id="mMove" class="on" data-i="walk">歩く</button><button id="mWall" data-i="wall">かべをおく</button><button id="undo" disabled data-i="undo">↩ 一手戻す</button></nav>
<div class="ov" id="ov"><div><div class="big" id="ovE"></div><h2 id="ovT"></h2><button id="again" data-i="again">もう一度</button><br><button id="menu2" data-i="menu2">メニューへ</button></div></div>
<div class="ov show" id="start"><div class="sp"><h2 class="st">QUORIDOR</h2><p class="sub" data-i="sub">コリドール</p>
<div class="seg" id="sgLang"><button data-v="ja">日本語</button><button data-v="en">English</button><button data-v="zh">中文</button></div>
<div class="seg" id="sgMode"><button data-v="pvp" class="on" data-i="mFriend">友達と遊ぶ</button><button data-v="cpu" data-i="mCpu">CPUと遊ぶ</button></div>
<div class="opt" id="optPvp"><label data-i="firstQ">はじめに動くのは</label><div class="seg" data-k="first"><button data-v="1" data-i="sideL">左(ルナ)</button><button data-v="0" class="on" data-i="sideR">右(ソル)</button></div></div>
<div class="opt" id="optCpu" hidden><label data-i="lvQ">CPUのつよさ</label><div class="seg" data-k="level"><button data-v="1" data-i="lv1">かんたん</button><button data-v="2" class="on" data-i="lv2">ふつう</button><button data-v="3" data-i="lv3">つよい</button></div>
<label data-i="sideQ">あなたの陣地</label><div class="seg" data-k="hu"><button data-v="1" data-i="sideL">左(ルナ)</button><button data-v="0" class="on" data-i="sideR">右(ソル)</button></div>
<label data-i="firstQ">はじめに動くのは</label><div class="seg" data-k="me"><button data-v="1" class="on" data-i="me">あなた</button><button data-v="0" data-i="cpuWho">CPU</button></div></div>
<button id="go" data-i="go">スタート</button></div></div>
<script>
const D=[[-1,0],[1,0],[0,-1],[0,1]],EM=['<i class="dot d0"></i>','<i class="dot d1"></i>'],NM=['ソル','ルナ'];
const mk=()=>Array.from({length:8},()=>Array(8).fill(false));
const inb=(r,c)=>r>=0&&r<9&&c>=0&&c<9;
let S,H=[];
function init(){H=[];S={p:[{r:8,c:4,w:10},{r:0,c:4,w:10}],h:mk(),v:mk(),turn:CFG.first,mode:'move',pend:null,win:null,msg:''};clearTimeout(CT);render();kick()}
const hw=(r,c)=>S.h[r]?.[c]===true, vw=(r,c)=>S.v[r]?.[c]===true;
function blocked(r,c,dr,dc){
  if(dr===-1)return hw(r-1,c)||hw(r-1,c-1);
  if(dr===1)return hw(r,c)||hw(r,c-1);
  if(dc===1)return vw(r,c)||vw(r-1,c);
  return vw(r,c-1)||vw(r-1,c-1);
}
function moves(i){
  const me=S.p[i],op=S.p[1-i],out=[];
  for(const [dr,dc] of D){
    if(blocked(me.r,me.c,dr,dc))continue;
    const nr=me.r+dr,nc=me.c+dc;
    if(!inb(nr,nc))continue;
    if(nr!==op.r||nc!==op.c){out.push([nr,nc]);continue}
    const jr=nr+dr,jc=nc+dc;
    if(inb(jr,jc)&&!blocked(nr,nc,dr,dc)){out.push([jr,jc]);continue}
    for(const [sr,sc] of D){
      if(sr*dr+sc*dc!==0||blocked(nr,nc,sr,sc))continue;
      const tr=nr+sr,tc=nc+sc;
      if(inb(tr,tc))out.push([tr,tc]);
    }
  }
  return out;
}
function reach(i){
  const g=i?8:0,q=[[S.p[i].r,S.p[i].c]],seen=new Set([q[0]+'']);
  while(q.length){
    const [r,c]=q.shift();
    if(r===g)return true;
    for(const [dr,dc] of D){
      const nr=r+dr,nc=c+dc,k=nr+','+nc;
      if(!inb(nr,nc)||blocked(r,c,dr,dc)||seen.has(k))continue;
      seen.add(k);q.push([nr,nc]);
    }
  }
  return false;
}
function canWall(t,r,c){
  if(r<0||r>7||c<0||c>7)return false;
  const A=t==='h'?S.h:S.v,B=t==='h'?S.v:S.h;
  if(A[r][c]||B[r][c])return false;
  if(t==='h'?(hw(r,c-1)||hw(r,c+1)):(vw(r-1,c)||vw(r+1,c)))return false;
  A[r][c]=true;
  const ok=reach(0)&&reach(1);
  A[r][c]=false;
  return ok;
}
function end(){S.pend=null;S.msg='';S.turn=1-S.turn;kick()}
function render(){
  const t=S.turn,cur=S.p[t],wm=S.mode==='wall';
  document.getElementById('pl0').innerHTML=card(0);document.getElementById('pl1').innerHTML=card(1);document.getElementById('undo').disabled=!canUndo();
  document.getElementById('hint').textContent=S.msg||(isCpuTurn()?T('think'):wm?(cur.w>0?(S.pend?(selCands().length>1?T('h1'):T('h2')):T('h3')):T('h4')):T('h5'));
  document.getElementById('mMove').classList.toggle('on',!wm);
  document.getElementById('mWall').classList.toggle('on',wm);
  const lg=wm||S.win||isCpuTurn()?[]:moves(t);
  let h='';
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const ok=lg.some(m=>m[0]===r&&m[1]===c);
    let pw='';
    [0,1].forEach(i=>{if(S.p[i].r===r&&S.p[i].c===c)pw=`<i class="pawn p${i}${i===t&&!S.win?' me':''}">${fig(i)}</i>`});
    h+=`<div class="cell${r===0?' g0':r===8?' g1':''}${ok?' ok':''}" data-m="${r},${c}" style="grid-row:${2*c+1};grid-column:${2*r+1}">${pw}</div>`;
  }
  if(wm&&cur.w>0&&!S.win&&!isCpuTurn()){
    for(let r=0;r<8;r++)for(let c=0;c<9;c++)h+=`<div class="gr${gc('h',r,c)}" data-w="h,${r},${c}" style="grid-row:${2*c+1};grid-column:${2*r+2}"></div>`;
    for(let r=0;r<9;r++)for(let c=0;c<8;c++)h+=`<div class="gr${gc('v',c,r)}" data-w="v,${c},${r}" style="grid-row:${2*c+2};grid-column:${2*r+1}"></div>`;
  }
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(S.h[r][c])h+=`<b class="wall${S.last==='h,'+r+','+c?' new':''}" style="grid-row:${2*c+1}/span 3;grid-column:${2*r+2}"></b>`;
    if(S.v[r][c])h+=`<b class="wall${S.last==='v,'+r+','+c?' new':''}" style="grid-row:${2*c+2};grid-column:${2*r+1}/span 3"></b>`;
  }
  if(S.pend)for(const st of selCands()){const [pr,pc]=wcoord(S.pend.t,S.pend.line,st);
    h+=S.pend.t==='h'?`<b class="wall pre" style="grid-row:${2*pc+1}/span 3;grid-column:${2*pr+2}"></b>`:`<b class="wall pre" style="grid-row:${2*pc+2};grid-column:${2*pr+1}/span 3"></b>`}
  document.getElementById('board').className='board t'+t+(wm?' wm':'');
  document.getElementById('board').innerHTML=h;S.fx=null;S.last=null;
}
